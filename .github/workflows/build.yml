name: Build Kumo Engine

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    name: Build standalone Windows EXE
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage standalone EXE
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/kumo_engine.exe"
          if (!(Test-Path $exe)) {
            Write-Error "Expected executable was not produced: $exe"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item $exe "dist/KumoEngine.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KumoEngine-Windows-x64
          path: dist/KumoEngine.exe
          if-no-files-found: error
          compression-level: 0
